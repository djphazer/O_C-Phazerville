name: Phazerville Custom Firmware

on:
  push:
    branches: [main]
    paths:
      - 'software/**'
      - '.github/workflows/firmware.yml'
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Optional upstream tag, branch, or SHA to build'
        required: false

permissions:
  contents: write

env:
  UPSTREAM_REPOSITORY: djphazer/O_C-Phazerville
  FULL_BUILD_REQUEST: oc-build/1 target=T32_VOR apps=+PEWPEWPEW,+NOWAVE,+NOPONGLET,+NOTUNER,+NOENVSEQ,+NOFROGSEQ
  T32_EXTRA_BUILD_FLAGS: -DNO_DISPLAY_DMA
  FULL_VOR_EXTRA_BUILD_FLAGS: -DNO_APPLET_SCOPE
  LEAN_BUILD_REQUEST: oc-build/1 target=T32_VOR apps=+MIDI,+AUTOMATONNETZ,+NOENVSEQ,+NOPIQUET,+NOFROGSEQ

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Select source
      id: source
      env:
        GH_TOKEN: ${{ github.token }}
        UPSTREAM_REF: ${{ github.event.inputs.upstream_ref }}
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
          ref="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq '.tag_name')"
          upstream_release=true
        elif [[ -n "${UPSTREAM_REF}" ]]; then
          ref="${UPSTREAM_REF}"
          upstream_release=false
        else
          ref=""
          upstream_release=false
        fi

        {
          echo "ref=${ref}"
          echo "upstream_release=${upstream_release}"
        } >> "$GITHUB_OUTPUT"

    - name: Check upstream release cache
      id: upstream-release-cache
      if: steps.source.outputs.upstream_release == 'true'
      uses: actions/cache/restore@v5
      with:
        path: .upstream-release-cache
        key: upstream-release-${{ steps.source.outputs.ref }}

    - name: Check upstream release ancestry
      id: upstream-release-ancestry
      if: steps.source.outputs.upstream_release == 'true' && steps.upstream-release-cache.outputs.cache-hit != 'true'
      run: |
        git fetch --tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "${{ steps.source.outputs.ref }}"

        if git merge-base --is-ancestor FETCH_HEAD HEAD; then
          already_in_main=true
        else
          already_in_main=false
        fi

        echo "already_in_main=${already_in_main}" >> "$GITHUB_OUTPUT"

    - name: Decide whether to build
      id: build-gate
      run: |
        should_build=true

        if [[ "${{ steps.upstream-release-cache.outputs.cache-hit }}" == "true" ]]; then
          should_build=false
        fi

        if [[ "${{ steps.upstream-release-ancestry.outputs.already_in_main }}" == "true" ]]; then
          should_build=false
        fi

        echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"

    - name: Parse build request
      if: steps.build-gate.outputs.should_build == 'true'
      run: |
        {
          echo "FULL_CUSTOM_BUILD_FLAGS=$(GH_COMMENT="${FULL_BUILD_REQUEST}" python software/res/parse_build_request.py)"
          echo "LEAN_CUSTOM_BUILD_FLAGS=$(GH_COMMENT="${LEAN_BUILD_REQUEST}" python software/res/parse_build_request.py)"
        } >> "$GITHUB_ENV"

    - name: Merge upstream source
      if: steps.build-gate.outputs.should_build == 'true' && steps.source.outputs.ref != ''
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
        git fetch --tags upstream "${{ steps.source.outputs.ref }}"
        git merge --no-commit --no-ff FETCH_HEAD
        git submodule update --init --recursive
        echo "SOURCE_SHORT_SHA=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_ENV"

    - name: Setup build metadata
      if: steps.build-gate.outputs.should_build == 'true'
      run: |
        upstream_version="$(tail -n 1 software/src/OC_version.h | tr -d '"')"
        release_version="${upstream_version}+build.${GITHUB_RUN_NUMBER}"
        short_sha="${SOURCE_SHORT_SHA:-$(git rev-parse --short HEAD)}"
        {
          echo "UPSTREAM_VERSION=${upstream_version}"
          echo "BUILD_ID=${GITHUB_RUN_NUMBER}"
          echo "RELEASE_VERSION=${release_version}"
          echo "SOURCE_SHORT_SHA=${short_sha}"
          echo "OC_ARTIFACT_TAG=${release_version}-${short_sha}"
        } >> "$GITHUB_ENV"

    - name: Cache PlatformIO
      if: steps.build-gate.outputs.should_build == 'true'
      uses: actions/cache@v5
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}

    - name: Set up Python
      if: steps.build-gate.outputs.should_build == 'true'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: '**/requirements.txt'

    - if: steps.build-gate.outputs.should_build == 'true'
      run: |
        pip3 install --upgrade pip
        pip3 install -r .github/workflows/requirements.txt

    - name: Build firmware
      if: steps.build-gate.outputs.should_build == 'true'
      working-directory: software
      run: |
        mkdir -p ../artifacts

        build_firmware() {
          local label="$1"
          local flags="$2"
          local version_suffix="$3"
          local output="$4"

          echo "Building ${label}"
          export CUSTOM_BUILD_FLAGS="${flags} -DOC_VERSION_SUFFIX=${version_suffix}"
          pio run -t clean -e custom
          pio run -e custom
          cp .pio/build/custom/*.hex "${output}"
        }

        build_firmware \
          "full Hemisphere T32 custom firmware" \
          "${FULL_CUSTOM_BUILD_FLAGS} ${T32_EXTRA_BUILD_FLAGS}" \
          "T32_pewpewpew" \
          "../artifacts/o_C-phazerville-${RELEASE_VERSION}_T32_pewpewpew-${SOURCE_SHORT_SHA}.hex"

        build_firmware \
          "full Hemisphere VOR T32 custom firmware" \
          "${FULL_CUSTOM_BUILD_FLAGS} ${T32_EXTRA_BUILD_FLAGS} ${FULL_VOR_EXTRA_BUILD_FLAGS} -DVOR" \
          "T32_VOR_pewpewpew" \
          "../artifacts/o_C-phazerville-${RELEASE_VERSION}_T32_VOR_pewpewpew-${SOURCE_SHORT_SHA}.hex"

        build_firmware \
          "lean Hemisphere T32 custom firmware" \
          "${LEAN_CUSTOM_BUILD_FLAGS} ${T32_EXTRA_BUILD_FLAGS}" \
          "T32_lean" \
          "../artifacts/o_C-phazerville-${RELEASE_VERSION}_T32_lean-${SOURCE_SHORT_SHA}.hex"

        build_firmware \
          "lean Hemisphere VOR T32 custom firmware" \
          "${LEAN_CUSTOM_BUILD_FLAGS} ${T32_EXTRA_BUILD_FLAGS} -DVOR" \
          "T32_VOR_lean" \
          "../artifacts/o_C-phazerville-${RELEASE_VERSION}_T32_VOR_lean-${SOURCE_SHORT_SHA}.hex"

    - name: Upload artifact
      if: steps.build-gate.outputs.should_build == 'true'
      uses: actions/upload-artifact@v7
      with:
        name: o_C-${{env.OC_ARTIFACT_TAG}}
        include-hidden-files: true
        path: artifacts/*.hex

    - name: Publish release
      if: github.ref == 'refs/heads/main' && steps.build-gate.outputs.should_build == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        notes_file="$(mktemp)"
        cat > "${notes_file}" <<EOF
        Custom Phazerville firmware build ${RELEASE_VERSION}.

        Upstream version: ${UPSTREAM_VERSION}
        Build id: ${BUILD_ID}
        Source short SHA: ${SOURCE_SHORT_SHA}
        EOF

        gh release create "${RELEASE_VERSION}" artifacts/*.hex \
          --repo "${GITHUB_REPOSITORY}" \
          --target "${GITHUB_SHA}" \
          --title "Phazerville ${RELEASE_VERSION}" \
          --notes-file "${notes_file}" \
          --latest

    - name: Mark upstream release built
      if: steps.source.outputs.upstream_release == 'true' && steps.upstream-release-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p .upstream-release-cache
        echo "${{ steps.source.outputs.ref }}" > .upstream-release-cache/ref

    - name: Save upstream release cache
      if: steps.source.outputs.upstream_release == 'true' && steps.upstream-release-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: .upstream-release-cache
        key: upstream-release-${{ steps.source.outputs.ref }}
